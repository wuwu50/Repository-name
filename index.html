<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'"
    />
    <meta
      name="description"
      content="在熟悉的桌面上，和你的像素兔兔一起放空。抓起、拍拍，看看牠探頭和聞聞。"
    />
    <title>兔兔的桌面</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="room" aria-label="兔兔桌面">
      <header>
        <h1>兔兔的桌面</h1>
        <p>陪牠一起跳跳、放空。</p>
      </header>
      <button
        id="pet"
        aria-label="兔兔，點一下拍拍，按住拖曳抓起；方向鍵移動"
        title="點一下拍拍 · 按住拖動"
      >
        <canvas id="sprite" width="160" height="160"></canvas
        ><span id="bubble" aria-hidden="true"></span>
      </button>
      <section id="agenda" hidden class="collapsed" aria-label="CEU醫學系課表">
        <div class="agenda-top">
          <div>
            <h2>醫學系課表</h2>
            <p>CEU · Valencia · 原站時間 Europe/Madrid</p>
          </div>
          <div class="agenda-links">
            <button
              id="agendaToggle"
              aria-expanded="false"
              aria-controls="agendaBody"
            >
              關閉課表</button
            ><a
              href="https://uch-espacios.publish.ceu.es/VLC_G_MED/calendar"
              target="_blank"
              rel="noopener"
              >查看原始課表</a
            >
          </div>
        </div>
        <div id="agendaBody" hidden>
          <div class="agenda-controls">
            <button id="prevWeek" aria-label="上一週">上一週</button
            ><span id="weekLabel"></span
            ><button id="nextWeek" aria-label="下一週">下一週</button
            ><button id="thisWeek">本週</button
            ><select id="year" aria-label="年級">
              <option value="1">一年級</option>
              <option value="2">二年級</option>
              <option value="3">三年級</option>
              <option value="4">四年級</option>
              <option value="5" selected>五年級</option>
              <option value="6">六年級</option></select
            ><select id="group" aria-label="組別">
              <option value="">全部組別</option>
            </select>
          </div>
          <p id="sync" role="status">正在載入課表…</p>
          <p id="summary"></p>
          <div id="days"></div>
        </div>
      </section>
      <button id="grass" aria-label="叫兔兔過來吃草" title="點一下，叫兔兔吃草">
        <canvas id="grassCanvas" width="128" height="128"></canvas
        ><span>兔兔的草</span>
      </button>
      <aside id="petDock" aria-label="兔兔功能">
        <div id="petMenu" hidden>
          <p>兔兔功能</p>
          <button data-action="pat">拍拍</button
          ><button data-action="peek">探頭</button
          ><button data-action="sniff">聞聞</button
          ><button data-action="home">回桌上</button
          ><button data-action="eat">去吃草</button
          ><button data-action="sleep">睡覺</button
          ><button data-action="poop">拉屎</button
          ><button id="cleanAll" data-action="clean">一鍵清理</button
          ><button id="roamToggle" aria-pressed="true">自主跳動：開啟</button
          ><small>點一下拍拍 · 按住抓起</small>
        </div>
        <button
          id="petMenuToggle"
          aria-controls="petMenu"
          aria-expanded="false"
        >
          兔兔功能
        </button>
      </aside>
      <span
        id="status"
        role="status"
        style="
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip-path: inset(50%);
        "
      ></span>
    </main>
    <script src="pet.js"></script>
    <script src="calendar-ui.js"></script>
  </body>
</html>
