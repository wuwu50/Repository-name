name: Desktop release
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "公開此版本到 GitHub Releases"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw Error('Tag must match package.json version')"
      - run: npm ci
      - run: npm test
      - run: npm run release:${{ matrix.platform }}
      - run: node packaging/verify-dist.cjs ${{ matrix.platform }}
      - name: Verify macOS signature and architecture
        if: matrix.platform == 'mac'
        run: |
          codesign --verify --deep --strict release-v4/mac-arm64/RabbitDesktop.app
          test "$(lipo -archs release-v4/mac-arm64/RabbitDesktop.app/Contents/MacOS/RabbitDesktop)" = arm64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release-v4/*.exe
            release-v4/*.pkg
            release-v4/*.pkg.sha512
            release-v4/*.dmg
            release-v4/*.zip
            release-v4/*.blockmap
            release-v4/latest*.yml
  publish:
    if: github.event_name == 'push' || inputs.publish
    concurrency:
      group: desktop-publish-${{ github.repository }}
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version from the exact built commit
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Validate complete release
        shell: bash
        run: |
          test -f release/latest.yml
          test -f release/latest-mac.yml
          compgen -G 'release/*-win-x64.exe'
          compgen -G 'release/*-mac-arm64.dmg'
          compgen -G 'release/*-mac-arm64.zip'
          compgen -G 'release/*-mac-arm64.pkg'
          compgen -G 'release/*-mac-arm64.pkg.sha512'
      - name: Publish only after both platforms succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            test "$(cat draft.txt)" = true || { echo 'This version is already published; skipping without overwriting it.'; exit 0; }
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --draft --title "兔兔桌面寵物 $RELEASE_TAG" --notes 'Windows：下載 win-x64.exe 安裝，程式內檢查、下載並確認重新啟動安裝。Mac Apple Silicon：下載 mac-arm64.pkg，使用系統安裝程式，不需拖曳。新版本可在程式內下載並開啟安裝；依系統提示確認或輸入管理員密碼。目前仍無 Developer ID／公證。舊 v3 需先手動安裝正式 v4 一次。'
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
