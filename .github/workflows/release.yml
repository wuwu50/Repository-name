name: Desktop release
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-14
            platform: mac
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw Error('Tag must match package.json version')"
      - run: npm ci
      - run: npm test
      - run: npm run release:${{ matrix.platform }}
      - run: node packaging/verify-dist.cjs ${{ matrix.platform }}
      - name: Verify macOS signature and architecture
        if: matrix.platform == 'mac'
        run: |
          codesign --verify --deep --strict release-v4/mac-arm64/RabbitDesktop.app
          test "$(lipo -archs release-v4/mac-arm64/RabbitDesktop.app/Contents/MacOS/RabbitDesktop)" = arm64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release-v4/*.exe
            release-v4/*.dmg
            release-v4/*.zip
            release-v4/*.blockmap
            release-v4/latest*.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Validate complete release
        shell: bash
        run: |
          test -f release/latest.yml
          test -f release/latest-mac.yml
          compgen -G 'release/*-win-x64.exe'
          compgen -G 'release/*-mac-arm64.dmg'
          compgen -G 'release/*-mac-arm64.zip'
      - name: Publish only after both platforms succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            test "$(cat draft.txt)" = true || { echo 'Published releases are immutable; use a new version.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "兔兔桌面寵物 $RELEASE_TAG" --notes 'Windows：下載 win-x64.exe 安裝，程式內檢查、下載並確認重新啟動安裝。Mac Apple Silicon：下載 mac-arm64.dmg，拖曳至 Applications；目前為 ad-hoc 簽章，無 Developer ID／公證，自動檢查新版後需手動下載替換。舊 v3 需先手動安裝正式 v4 一次。'
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
